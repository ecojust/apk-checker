name: Test Maidong KTV release APK

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Test the standard phone/TV pair or the newer 64-bit TV image"
        type: choice
        options: [standard, tv-modern]
        default: standard
  push:
    branches: [feat/desktop-android-emulator]
    paths:
      - scripts/apk-smoke.ts
      - .github/workflows/apk-smoke.yml

permissions:
  contents: read

jobs:
  android-smoke:
    name: Maidong 2.1.8 / ${{ matrix.mode }} API ${{ matrix.api }} ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'tv-modern' && '[{"mode":"tv","api":36,"target":"android-tv","arch":"x86_64","profile":"tv_1080p"}]' || '[{"mode":"phone","api":30,"target":"google_apis","arch":"x86_64","profile":"pixel_2"},{"mode":"tv","api":31,"target":"android-tv","arch":"x86","profile":"tv_1080p"}]') }}
    env:
      EXPECTED_APK_SHA256: 86ef92ec8b1ac277eb68f28f3ff4fb421f7bc2a1e6093229a706d3aaa0310a3b
      APK_TEST_MODE: ${{ matrix.mode }}
      APK_TEST_AVD: apk_${{ matrix.mode }}
      APK_TEST_SYSTEM_IMAGE: system-images;android-${{ matrix.api }};${{ matrix.target }};${{ matrix.arch }}
      SCRCPY_PATH: /usr/bin/scrcpy
      # CI has no physical sound card. Video/startup are tested; audio playback is not.
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install display and SDK tools
        run: |
          if [ "$APK_TEST_SYSTEM_IMAGE" = 'system-images;android-36;android-tv;x86_64' ]; then
            # Hosted Android runners already provide Xvfb, adb and Build-Tools.
            # The pinned modern scrcpy below replaces the distro package.
            command -v xvfb-run
            test -x "$ANDROID_HOME/platform-tools/adb"
          else
            sudo apt-get update
            sudo apt-get install -y scrcpy xvfb
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' 'platform-tools'
          fi
      - name: Install current scrcpy for Android 16 compatibility
        if: inputs.target == 'tv-modern'
        run: |
          curl --fail --location --retry 3 \
            'https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-linux-x86_64-v5.0.1.tar.gz' \
            --output "$RUNNER_TEMP/scrcpy.tar.gz"
          printf '%s  %s\n' '9f969d30cc574816077edecda65719c1c70b0aee1df1ba5fa00779ac07b8fd6e' "$RUNNER_TEMP/scrcpy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/scrcpy.tar.gz" -C "$RUNNER_TEMP"
          echo "SCRCPY_PATH=$RUNNER_TEMP/scrcpy-linux-x86_64-v5.0.1/scrcpy" >> "$GITHUB_ENV"
          echo "SCRCPY_SERVER_PATH=$RUNNER_TEMP/scrcpy-linux-x86_64-v5.0.1/scrcpy-server" >> "$GITHUB_ENV"
      - name: Download exact release APK and verify checksum
        run: |
          APK_PATH="$RUNNER_TEMP/Maidong-KTV-2.1.8.apk"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 300 \
            'https://gitee.com/yangyachao-X/maidong-ktv/releases/download/2.1.8/Maidong-KTV-2.1.8.apk' \
            --output "$APK_PATH"
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" "$APK_PATH" | sha256sum --check --strict
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real import, install, video window and navigation checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          avd-name: apk_${{ matrix.mode }}
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: xvfb-run -a npm run test:apk
      - name: Upload screenshots, metadata and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Maidong-2.1.8-${{ matrix.mode }}-smoke-report
          path: artifacts/apk-smoke-${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish readable test summary
        if: always()
        run: |
          REPORT="artifacts/apk-smoke-$APK_TEST_MODE/summary.json"
          if [ -f "$REPORT" ]; then
            echo '### Actual release APK test' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Delete downloaded APK
        if: always()
        run: rm -f "$APK_PATH"
