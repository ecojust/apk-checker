name: Test self-contained Android runtime

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Managed Android environment to prepare and test from scratch
        type: choice
        options: [both, phone, tv]
        default: both
  push:
    branches: [feat/desktop-android-emulator]
    paths:
      - scripts/managed-apk-smoke.ts
      - .github/workflows/managed-apk-smoke.yml

permissions:
  contents: read

jobs:
  managed-smoke:
    name: Managed runtime / ${{ matrix.mode }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.mode == 'phone' && '["phone"]' || inputs.mode == 'tv' && '["tv"]' || '["phone","tv"]') }}
    env:
      APK_TEST_MODE: ${{ matrix.mode }}
      # CI has no sound card. This preserves video while making no audio claim.
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Enable host KVM and check display service
        run: |
          command -v xvfb-run
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: Prepare installer-provided core archives
        run: npm run runtime:prepare
      - name: Download and verify original Maidong KTV release
        run: |
          APK_PATH="$RUNNER_TEMP/Maidong-KTV-2.1.8.apk"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 \
            'https://gitee.com/yangyachao-X/maidong-ktv/releases/download/2.1.8/Maidong-KTV-2.1.8.apk' \
            --output "$APK_PATH"
          printf '%s  %s\n' '86ef92ec8b1ac277eb68f28f3ff4fb421f7bc2a1e6093229a706d3aaa0310a3b' "$APK_PATH" | sha256sum --check --strict
      - name: Prepare and run private Android environment through application code
        run: xvfb-run -a npx --no-install tsx scripts/managed-apk-smoke.ts
      - name: Publish readable test result
        if: always()
        run: |
          REPORT="artifacts/managed-apk-$APK_TEST_MODE/summary.json"
          if [ -f "$REPORT" ]; then
            echo '### Self-contained Android runtime test' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostic evidence without APK or system images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Managed-Maidong-2.1.8-${{ matrix.mode }}-report
          path: artifacts/managed-apk-${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Delete downloaded APK
        if: always()
        run: rm -f "$APK_PATH"
