name: Test self-contained Android runtime

on:
  workflow_dispatch:
    inputs:
      application:
        description: Fixed original public APK reference release
        type: choice
        options: [maidong, vstv]
        default: maidong
      mode:
        description: Managed Android environment to prepare and test from scratch
        type: choice
        options: [both, phone, tv]
        default: both
      login_probe:
        description: Check the empty protected login dialog in the native display (no credentials)
        type: boolean
        default: true
      keyboard_probe:
        description: Check host keys and managed text input in public search (no accounts or Enter)
        type: boolean
        default: true
  push:
    branches: [feat/desktop-android-emulator]
    paths:
      - scripts/managed-apk-smoke.ts
      - scripts/managed-apk-fixtures.json
      - scripts/download-managed-apk.mjs
      - scripts/login-smoke.ts
      - scripts/keyboard-smoke.ts
      - .github/workflows/managed-apk-smoke.yml

permissions:
  contents: read

jobs:
  managed-smoke:
    name: Managed runtime / ${{ matrix.mode }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.mode == 'phone' && '["phone"]' || inputs.mode == 'tv' && '["tv"]' || '["phone","tv"]') }}
    env:
      APK_TEST_MODE: ${{ matrix.mode }}
      APK_TEST_APPLICATION: ${{ inputs.application || 'maidong' }}
      APK_LOGIN_PROBE: ${{ inputs.application != 'vstv' && (github.event_name == 'push' || inputs.login_probe) && '1' || '0' }}
      APK_KEYBOARD_PROBE: ${{ inputs.application != 'vstv' && (github.event_name == 'push' || inputs.keyboard_probe) && '1' || '0' }}
      # CI has no sound card. This preserves video while making no audio claim.
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Enable host KVM and check display service
        run: |
          command -v xvfb-run || { echo '::error title=Host display prerequisite::xvfb-run is missing from the hosted Linux runner'; exit 1; }
          test -e /dev/kvm || { echo '::error title=Host virtualization prerequisite::The hosted runner has no /dev/kvm device'; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # udev applies permissions asynchronously; wait before the assertion.
          sudo udevadm settle --timeout=30
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || { echo '::error title=Host virtualization prerequisite::The runner user cannot read/write /dev/kvm after configuration'; exit 1; }
      - name: Install small preview-image test dependency
        if: env.APK_LOGIN_PROBE == '1'
        run: python3 -m pip install --disable-pip-version-check 'Pillow==12.0.0'
      - name: Install native emulator host audio library
        run: |
          if ! python3 -c 'import ctypes; ctypes.CDLL("libpulse.so.0")'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libpulse0
          fi
          python3 -c 'import ctypes; ctypes.CDLL("libpulse.so.0")'
      - name: Prepare installer-provided core archives
        run: npm run runtime:prepare
      - name: Download and verify fixed original APK release
        run: |
          APK_PATH="$RUNNER_TEMP/managed-$APK_TEST_APPLICATION.apk"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          node scripts/download-managed-apk.mjs "$APK_PATH"
      - name: Prepare and run private Android environment through application code
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npx --no-install tsx scripts/managed-apk-smoke.ts
      - name: Publish readable test result
        if: always()
        run: |
          REPORT="artifacts/managed-apk-$APK_TEST_MODE/summary.json"
          if [ -f "$REPORT" ]; then
            echo '### Self-contained Android runtime test' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostic evidence without APK or system images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Managed-${{ env.APK_TEST_APPLICATION }}-${{ matrix.mode }}-report
          path: artifacts/managed-apk-${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Delete downloaded APK
        if: always()
        run: rm -f "$APK_PATH"
